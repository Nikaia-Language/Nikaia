# The consumer that exercises ADR-289 D1's path arm for a **Nikaia** package.
#
# The `type = "rust"` arm has `examples/foreign-runtime/`; this is the other
# one, and until this directory existed nothing in the corpus wrote it.
[package]
name = "hello-http"
version = "0.1.0"

[build]
user-parallelism = "no"

# **A path is relative to this file**, whichever arm of `[dependencies]` it is
# in ([ADR-286](../../docs/specification/adr/adr-286.md) D16). The two used to be
# resolved against different things - a Nikaia package against this directory
# and a Rust crate against the *generated* manifest - which is why
# `examples/foreign-runtime/serve` climbed four levels and this one climbs one,
# and why those three projects stopped building when that manifest moved.
[dependencies]
http = { path = "../http" }
