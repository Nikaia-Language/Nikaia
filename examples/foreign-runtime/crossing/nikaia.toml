[package]
name = "foreign-runtime-crossing"
version = "0.1.0"

# The switch D7's first rule is about. `no` is the default and is written down
# anyway, because a foreign thread exists whatever this says - which is the
# whole finding.
#
# It used to say *"the setting under which `Shared` would be an `Rc`
# (ADR-037 D3)"*, and that stopped being true: ADR-037 D6 narrowed D3, so
# `Shared` is an atomic count at **both** settings and this switch no longer
# changes its representation.
[build]
user-parallelism = "no"

# `type = "rust"` is ADR-002 D1's passthrough: the value with `type` removed
# reaches Cargo verbatim - narrowed by one key
# ([ADR-286](../../../docs/specification/adr/adr-286.md) D17), which resolves a
# relative `path` against **this file** and writes it absolute into the
# generated manifest. So this is the directory beside this one, as it would be
# anywhere else. It used to climb four levels, against a generated manifest
# that has not been where the count assumed since ADR-286 D19 - and these three
# projects did not build.
[dependencies]
hyper-shim = { type = "rust", path = "../shim" }
