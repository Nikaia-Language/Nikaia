# What the boxed future costs a handler that does not pause
# ([ADR-277](../../docs/specification/adr/adr-277.md) D12).
#
# It depends on `nikaia-std` for the same reason `benches/lockfree` does: the
# future is driven by the executor a generated program is driven by, so
# measuring it against anything else would be measuring a shape no program gets.
[package]
name = "handler-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
nikaia-std = { path = "../../crates/nikaia-std" }
