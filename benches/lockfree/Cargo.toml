# What a compare-and-swap loop costs against the two lock shapes this compiler
# actually writes.
#
# **It depends on `nikaia-std` on purpose**, which is the opposite of
# `benches/lockfloor`'s choice and for the same reason: that bench measured
# `RefCell` against `Mutex` because neither was yet what the emitter wrote.
# `nikaia_std::lock::Local` and `Crossing` *are* what it writes now (ADR-281,
# ADR-281), owner check and all, so measuring anything else would be measuring
# a shape no program gets.
[package]
name = "lockfree-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
nikaia-std = { path = "../../crates/nikaia-std" }
