[workspace]
resolver = "2"
members = [
    "crates/orchestrator",
    "crates/nikaia",
    "crates/nikaia-logic",
    "crates/nikaia-std",
    "benches/overlap",
    "benches/refcount",
    "benches/lockfloor",
    "benches/lockfree",
    "benches/handler",
    "benches/sendfile",
    "benches/envelope",
    "benches/brc",
    "benches/taskblock",
]
# One crate per `unsafe` topic, each its own workspace with its own checks
# (ADR-218). The crates here reach them as path dependencies.
exclude = ["crates/unsafe"]

[workspace.dependencies]
orchestrator = { path = "crates/orchestrator" }
nikaia-std = { path = "crates/nikaia-std" }
nikaia-logic = { path = "crates/nikaia-logic" }
# `rayon`: `parse_<rule>_pieces` runs the pieces of a `par_fold` on rayon's
# pool. It is the runtime of every generated program, and it is set here rather
# than on `nikaia-std` alone so that one build never holds two differently
# featured copies of the crate - the tests link the emitted Rust against
# whatever is in the deps directory, and it has to be the same one. Pinned to a
# commit rather than following `main`, so that a build is the build that was
# measured and a parser change arrives as a reviewed bump.
winnow-grammar = { git = "https://github.com/keywan-ghadami/winnow-grammar", rev = "3ca83d3a279976820c8f1cf9324ee0637a2a4e5c", version = "0.1.0", features = ["rayon"] }
winnow = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"

[profile.dev]
opt-level = 0
# No debug information: every integration test is a binary of its own with
# the compiler and `std` linked in, and with full debug information the
# suite's build filled a session's disk (27 GB). Panics still name their file
# and line; a backtrace and a debugger lose them. Set
# `CARGO_PROFILE_DEV_DEBUG=true` for a build that needs them.
debug = 0

[profile.release]
opt-level = 3
debug = false
