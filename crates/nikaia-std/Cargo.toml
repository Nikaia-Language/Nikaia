[package]
name = "nikaia-std"
version = "0.1.0"
edition = "2024"
# The oldest Rust this builds and is tested on (ADR-305); the emitter's
# `RUST_FLOOR` says the same.
rust-version = "1.88"

# **The re-entrancy check is a build option** (ADR-281 D36, Part I 1.2). It is on
# by default and a program that declines it is built with `default-features =
# false`, which the orchestrator writes into the generated manifest from the
# `[build]` key. It is a Cargo feature because the check lives in this crate,
# and a switch the compiler acts on has to reach the crate the code is in.
[features]
default = ["reentrancy-check"]
reentrancy-check = []
# The `grammar!` expansion in `src/rust.rs` checks this feature, so it has to
# exist here as it does on the compiler - a `cfg` naming a feature no manifest
# declares is a warning about a generated file, which Part III C.1 makes a
# defect.
trace = ["winnow-grammar/trace"]

[dependencies]
# Views that outlive the scope that read their buffer (ADR-283); the `unsafe`
# it takes lives there, with its own checks (ADR-218).
tether = { path = "../unsafe/tether" }
# Bytes checked as text once, in chunks across the pool, and a file mapped and
# checked (Part III 17.1).
checked-text = { path = "../unsafe/checked-text", features = ["rayon", "map"] }
# Text a C library owns, copied out (ADR-302 D8).
c-text = { path = "../unsafe/c-text" }
# An error's site in one word, or its cold part boxed (ADR-280 D24).
ref-or-box = { path = "../unsafe/ref-or-box" }
# An index the compiler proved inside, read and written without its check
# (ADR-306 D5).
proven-index = { path = "../unsafe/proven-index" }
# The parser backend every generated program runs on. Declared here, on the
# runtime, so that a program's `std` and its parser are one dependency - and
# so that the tests can find the parser's rlib by reading this crate's
# metadata rather than guessing among the copies in the deps directory.
winnow-grammar = { workspace = true }
# Named directly because a `grammar` **in this crate** expands to code that
# writes `winnow::…` (`src/tools/rust.nika`, ADR-290 D16). A generated program declares
# it for the same reason; until `std` held a grammar of its own, this crate
# reached it only through `winnow-grammar` and never by name.
winnow = { workspace = true }
# The UTF-8 check `fs::map` owes its `&str` views is chunked across this pool.
# The same pool the parallel piece driver uses, so a program has one - and the
# pool ADR-303 D4 starts for user code at `user_parallelism = yes`.
rayon = "1.10"
# ADR-303 D3's readiness half: `epoll`/`kqueue`/IOCP and nothing else. No
# executor, no task model, no opinion about what the program does when a socket
# is ready - which is what keeps D1's and D3's decisions from being remade by a
# dependency.
polled = { path = "../unsafe/polled" }

# ADR-303 D3's completion half. A *target* gate and not a feature gate: the
# bindings do not exist off Linux at all. On Linux whether the ring is used is
# decided at **run time** (`rt::config::Method::Auto` probes the kernel), so a
# binary built on a machine with io_uring still runs on one without it.
[target.'cfg(target_os = "linux")'.dependencies]
# ADR-303 D3's completion half, with the bell ADR-121 D1 hangs on it: the ring
# and the `unsafe` it takes live in their own crate (ADR-218).
file-ring = { path = "../unsafe/file-ring" }

# **No build dependencies, and that is the point** (ADR-002 D4). This crate used
# to build the Stage 0 compiler to lower its own `src/*.nika`, which meant Cargo
# compiled the compiler library a second time inside every project's `target/` -
# 58 of a hello-world's 103 resolved packages existed only for that, `clap`,
# `toml`, `sha2` and `nikaia` itself among them. The Nikaia half is lowered at
# release time now and the `.rs` is committed beside the `.nika`, so building
# `std` needs nothing but `rustc`.
