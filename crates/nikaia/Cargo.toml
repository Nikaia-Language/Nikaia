[package]
name = "nikaia"
version = "0.1.0"
edition = "2024"
# The oldest Rust this builds and is tested on (ADR-305); the emitter's
# `RUST_FLOOR` says the same.
rust-version = "1.88"

[features]
default = []
# Turn on winnow's parser trace (`cargo run --features trace`). The grammar!
# expansion checks this feature, so it must exist here too.
trace = ["winnow-grammar/trace"]

[[bin]]
name = "nikaia"

[build-dependencies]
# `build.rs` fingerprints the compiler's own sources for the cache key.
sha2 = "0.10"
# ... and reads `[workspace.dependencies]` for the runtime versions a generated
# program declares, which a sysroot has no workspace to carry (ADR-002 D4).
toml = "0.9"

[dependencies]
orchestrator = { workspace = true }
# **`nikaia describe`'s parser is written in Nikaia** (ADR-290 D13), lowered
# ahead of time and reached from here as an ordinary Rust module
# (ADR-290 D16, D18): `nikaia_std::tools::rust`. There is no cycle — `nikaia-std`
# may not depend on the compiler (ADR-002 D4), and its own manifest says so.
# Measured before the edge was drawn: four packages the compiler did not
# already resolve (`nikaia-std`, `memmap2`, `polling`, `io-uring`; `rayon` and
# `libc` were already in the tree), and it was a dev-dependency here already.
nikaia-std = { workspace = true }
# The prover's logic layer: terms, queries and the solver, knowing nothing of
# Nikaia (ADR-270 D1).
nikaia-logic = { workspace = true }
winnow = { workspace = true }
winnow-grammar = { workspace = true }
# `nikaia.toml`'s build switches (ADR-037 D5).
toml = "0.9"
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
