[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"
# The oldest Rust this builds and is tested on (ADR-305); the emitter's
# `RUST_FLOOR` says the same.
rust-version = "1.88"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
which = "6.0"
