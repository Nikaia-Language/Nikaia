# Stable is the toolchain, and the only one (ADR-001 D1).
#
# Nothing in the workspace needs a nightly: no `-Z` flag is passed in any build,
# no crate declares a `#![feature(…)]`, and the Rust the compiler emits uses no
# unstable feature either. This file is the single source of truth for the
# channel, and the channel is never repeated anywhere else.
#
# The *version floor* is a different fact and does not live here: Rust 1.88 is
# the oldest this works with, measured by running the test suite on it
# (ADR-305). The emitter's `RUST_FLOOR` holds it, writes it as `rust-version`
# into every generated Cargo.toml, and `scripts/check-floor.sh` tests on it.
[toolchain]
channel = "stable"
# rustfmt/clippy are needed by scripts/pre-commit.sh and CI.
components = ["rustfmt", "clippy"]
